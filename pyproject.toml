[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scaleimts"
version = "0.1.0"
description = "ScaleIMTS for irregular multivariate time series"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
  "transformers>=4.38",
]

[tool.setuptools]
package-dir = { "scaleimts" = "." }
packages = ["scaleimts", "scaleimts.data", "scaleimts.data.classification", "scaleimts.data.human_activity", "scaleimts.data.mimic_iii", "scaleimts.data.p12", "scaleimts.data.ushcn", "scaleimts.models", "scaleimts.models.core", "scaleimts.preprocessing", "scaleimts.training", "scaleimts.utils", "scaleimts.tests"]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
